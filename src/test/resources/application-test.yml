spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///fooddelivery
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672

jwt:
  secret: test-secret-key-that-is-long-enough-for-testing-purposes-256-bits
  expiration: 3600000
  refresh-expiration: 86400000

logging:
  level:
    com.fooddelivery: DEBUG
    org.springframework.security: DEBUG
