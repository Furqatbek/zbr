spring:
  application:
    name: food-delivery-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Give in-flight requests (e.g. an order write or payment confirm) up to 30s
  # to finish when the app is asked to stop, instead of being cut off.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fooddelivery}?currentSchema=public&TimeZone=UTC
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      pool-name: FoodDeliveryHikariPool
      max-lifetime: 1200000
      connection-timeout: 20000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: public

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    placeholder-replacement: false

  # Redis Configuration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # MVC Configuration - throw exception for proper error handling
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  # Behind the nginx TLS proxy: honour X-Forwarded-Proto/Host so the app knows
  # requests arrived over https, and X-Forwarded-For for per-IP rate limiting.
  forward-headers-strategy: framework
  # Drain in-flight requests on SIGTERM before the JVM exits (paired with
  # spring.lifecycle.timeout-per-shutdown-phase above).
  shutdown: graceful
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# JWT Configuration
# No default secret is committed. JWT_SECRET must be provided via environment.
# The app refuses to start (JwtService.validateSecret) if it is missing/weak/the old default.
jwt:
  secret: ${JWT_SECRET:}
  access-token:
    expiration: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes in ms
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in ms

# Application Configuration
app:
  # ISO-4217 code stamped on payments, payouts, referrals and analytics. The
  # platform operates in Uzbekistan, so amounts throughout are UZS. Money values
  # are stored as plain decimals, NOT minor units — 15000 means 15 000 so'm.
  # Changing this does not convert existing rows; it only labels new ones.
  currency: ${APP_CURRENCY:UZS}

  cors:
    # CORS only ever applies to BROWSER clients. The three React Native / Expo
    # apps use OkHttp and NSURLSession, send no Origin header, and are unaffected
    # by everything in this block. It exists for web callers: an Expo web build,
    # a future admin dashboard, a browser console.
    #
    # Origin patterns (addAllowedOriginPattern). Dev default accepts any localhost
    # port so a local web frontend works out of the box. PROD MUST set CORS_ORIGINS
    # to explicit real domains, e.g. CORS_ORIGINS=https://app.example.com
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
    allowed-methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    # Keep false — auth is a header Bearer token, not cookies. See CorsConfig.
    allow-credentials: false
    max-age: 3600

  rate-limit:
    enabled: true
    requests-per-minute: ${RATE_LIMIT_RPM:60}
    burst-capacity: ${RATE_LIMIT_BURST:10}

  payment:
    provider: stripe
    # No committed defaults. The webhook fails closed if the secret is unset/placeholder.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    api-key: ${PAYMENT_API_KEY:}

  order:
    auto-cancel-unpaid-minutes: 30
    max-preparation-minutes: 60
    delivery-radius-km: 10
    # Order-lifecycle scheduler (OrderLifecycleScheduler)
    auto-complete-delivered-minutes: ${ORDER_AUTOCOMPLETE_MINUTES:60}
    no-courier-timeout-minutes: ${ORDER_NO_COURIER_TIMEOUT_MINUTES:30}
    lifecycle-check-interval-ms: ${ORDER_LIFECYCLE_INTERVAL_MS:300000}

  # Restos external-menu integration (SSRF-guarded)
  integration:
    restos:
      enabled: ${RESTOS_ENABLED:true}
      connect-timeout-ms: ${RESTOS_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${RESTOS_READ_TIMEOUT_MS:10000}
      # Optional hostname allowlist; private/loopback/metadata IPs are always blocked.
      allowed-hosts: ${RESTOS_ALLOWED_HOSTS:}

  delivery:
    base-fee: ${DELIVERY_BASE_FEE:2.00}
    per-km-fee: ${DELIVERY_PER_KM_FEE:0.50}
    min-fee: ${DELIVERY_MIN_FEE:2.00}
    max-fee: ${DELIVERY_MAX_FEE:15.00}
    peak-hour-surcharge: ${DELIVERY_PEAK_SURCHARGE:1.50}
    peak-start-hour: 11
    peak-end-hour: 14
    evening-peak-start-hour: 18
    evening-peak-end-hour: 21
    routing:
      enabled: ${DELIVERY_ROUTING_ENABLED:false}
      osrm-base-url: ${DELIVERY_ROUTING_OSRM_URL:https://router.project-osrm.org}
      connect-timeout: ${DELIVERY_ROUTING_CONNECT_TIMEOUT:3000}
      read-timeout: ${DELIVERY_ROUTING_READ_TIMEOUT:5000}

  referral:
    reward-amount: 10.00
    currency: ${APP_CURRENCY:UZS}
    expiry-days: 30

  storage:
    images:
      path: ${IMAGE_STORAGE_PATH:/app/images}
      base-url: ${IMAGE_BASE_URL:http://localhost:8080/api/v1/images}
      max-size-mb: 5
      allowed-types: image/jpeg,image/png,image/gif,image/webp

  # SMS Configuration
  sms:
    # Global SMS settings
    enabled: ${SMS_ENABLED:true}
    provider: ${SMS_PROVIDER:ESKIZ}  # Options: ESKIZ, DEVSMS
    fallback-enabled: ${SMS_FALLBACK_ENABLED:false}
    fallback-provider: ${SMS_FALLBACK_PROVIDER:}  # Options: ESKIZ, DEVSMS

    # Eskiz SMS Provider (eskiz.uz)
    eskiz:
      enabled: ${SMS_ESKIZ_ENABLED:true}
      base-url: ${SMS_ESKIZ_BASE_URL:https://notify.eskiz.uz/api}
      email: ${SMS_ESKIZ_EMAIL:}
      password: ${SMS_ESKIZ_PASSWORD:}
      from: ${SMS_ESKIZ_FROM:4546}
      token-ttl-seconds: 2505600  # 29 days
      connect-timeout: 5000
      read-timeout: 30000
      max-retries: 3
      callback-url: ${SMS_ESKIZ_CALLBACK_URL:}

    # DevSMS Provider (devsms.uz)
    devsms:
      enabled: ${SMS_DEVSMS_ENABLED:false}
      base-url: ${SMS_DEVSMS_BASE_URL:https://devsms.uz/api}
      token: ${SMS_DEVSMS_TOKEN:}
      from: ${SMS_DEVSMS_FROM:4546}
      connect-timeout: 5000
      read-timeout: 30000
      max-retries: 3
      callback-url: ${SMS_DEVSMS_CALLBACK_URL:}

  # Notification settings
  notification:
    enabled: ${NOTIFICATION_ENABLED:true}

  # Push Notification settings
  push:
    enabled: ${PUSH_ENABLED:true}
    android:
      # Must match the notification channel the Android app creates at start-up.
      # If the app bumps the channel (e.g. orders_v3), bump this together.
      channel-id: ${PUSH_ANDROID_CHANNEL_ID:orders_v2}
      # Sound resource name WITHOUT the file extension (FCM requirement).
      sound: ${PUSH_ANDROID_SOUND:new_order}

  # Firebase Configuration for FCM push notifications (raw FCM/APNs tokens)
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    # Service-account key (SECRET — not the client-side google-services.json).
    # Supply EITHER as base64 in the environment (nothing on disk) OR as a
    # mounted file path. credentials-base64 wins.
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:firebase-service-account.json}

  # Expo Push transport for ExponentPushToken[...] device tokens (the mobile
  # apps register these; Expo fans out to FCM/APNs). Routing is by token format,
  # so Expo and Firebase transports coexist. access-token is optional.
  expo:
    push:
      enabled: ${EXPO_PUSH_ENABLED:true}
      url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
      access-token: ${EXPO_ACCESS_TOKEN:}

  # APNs (iOS) via HTTP/2 with a provider .p8 key — no Firebase on iOS.
  # Devices registered with platform=IOS are delivered here.
  # APNS_KEY_FILE is a SECRET: mount it, never commit it.
  # production=false targets api.sandbox.push.apple.com (Xcode/dev builds);
  # set APNS_PRODUCTION=true for TestFlight/App Store builds. Tokens are
  # environment-specific — a mismatch returns 400 BadDeviceToken.
  apns:
    enabled: ${APNS_ENABLED:false}
    # Supply the .p8 EITHER as base64 in the environment (nothing on disk,
    # secret-manager friendly) OR as a mounted file path. key-base64 wins.
    key-base64: ${APNS_KEY_BASE64:}
    key-file: ${APNS_KEY_FILE:}
    key-id: ${APNS_KEY_ID:}
    team-id: ${APNS_TEAM_ID:}
    topic: ${APNS_TOPIC:com.zbr.owner}
    production: ${APNS_PRODUCTION:false}

  # OTP Configuration
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    # App-store review test numbers. For these EXACT numbers, request-otp
    # succeeds WITHOUT sending an SMS and verify-otp accepts review-code — a
    # reviewer cannot receive our SMS. Both must be set or the feature stays off.
    # Set only while a review is in flight, then clear them.
    review-numbers: ${OTP_REVIEW_NUMBERS:}
    review-code: ${OTP_REVIEW_CODE:}
    rate-limit-per-hour: ${OTP_RATE_LIMIT:5}
    code-length: 6

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        # env and loggers deliberately NOT exposed (config dump / runtime log-level flip).
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
    prometheus:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.fooddelivery: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/food-delivery.log
    max-size: 10MB
    max-history: 30

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: false

  flyway:
    # In dev, allow modified migrations and out-of-order execution
    validate-on-migrate: false
    out-of-order: true

logging:
  level:
    com.fooddelivery: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

  # Do not leak internal exception messages to clients in production
  mvc:
    throw-exception-if-no-handler-found: true

logging:
  level:
    root: WARN
    com.fooddelivery: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","logger":"%logger{36}","message":"%msg"}%n'

# Disable API docs / Swagger UI in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Do not echo exception messages / binding errors to clients in production
server:
  error:
    include-message: never
    include-binding-errors: never

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

  flyway:
    # In Docker, allow modified migrations and out-of-order execution
    validate-on-migrate: false
    out-of-order: true

  # Redis configuration for Docker (no password)
  redis:
    host: redis
    port: 6379

  data:
    redis:
      host: redis
      port: 6379

# Local Docker launch: accept any origin by default so a web frontend on any
# host/port works out of the box. Safe here because allow-credentials is false —
# a wildcard origin cannot be turned into a credentialed cross-site read. A prod
# deploy via compose MUST still set CORS_ORIGINS to explicit real domains, so the
# door is shut before a browser client exists to walk through it.
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false

logging:
  level:
    com.fooddelivery: DEBUG
