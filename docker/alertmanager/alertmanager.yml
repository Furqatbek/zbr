# Alertmanager configuration.
#
# Delivery channel is Slack by default; the webhook URL is read from
# /etc/alertmanager/secrets/slack_api_url (mounted, gitignored) so it is never
# committed. See docs/ALERTING.md for Slack/Telegram/email setup.

global:
  resolve_timeout: 5m

route:
  receiver: 'team-notifications'
  group_by: ['alertname']
  group_wait: 30s        # wait to batch related alerts before the first notification
  group_interval: 5m     # wait before sending an update about new alerts in a group
  repeat_interval: 4h    # re-send an unresolved warning at most this often
  routes:
    # Critical alerts page faster and nag more often until resolved.
    - match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: 'team-notifications'
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_api_url
        channel: '#alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts -}}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.description }}
          {{ end }}

# A firing critical alert suppresses the matching warning for the same alertname,
# so you don't get paged twice for the same underlying problem.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
