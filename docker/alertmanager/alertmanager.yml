# Alertmanager configuration.
#
# Delivery channel is a Telegram bot. The bot token is read from
# /etc/alertmanager/secrets/telegram_bot_token (mounted, gitignored) so it is
# never committed; the chat id is set below. See docs/ALERTING.md for setup and
# for Slack/email alternatives.

global:
  resolve_timeout: 5m

route:
  receiver: 'team-notifications'
  group_by: ['alertname']
  group_wait: 30s        # wait to batch related alerts before the first notification
  group_interval: 5m     # wait before sending an update about new alerts in a group
  repeat_interval: 4h    # re-send an unresolved warning at most this often
  routes:
    # Critical alerts page faster and nag more often until resolved.
    - match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: 'team-notifications'
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        # TODO: replace with your Telegram chat/group id (see docs/ALERTING.md).
        # A group id is a negative number, e.g. -1001234567890.
        chat_id: 123456789
        send_resolved: true
        # Plain text (no parse_mode): alert descriptions contain '>' and '<'
        # (e.g. "pending > 0"), which would break Telegram HTML/Markdown parsing.
        message: |-
          {{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonAnnotations.summary }}
          {{ range .Alerts -}}
          • {{ .Labels.alertname }} ({{ .Labels.severity }})
          {{ .Annotations.description }}
          {{ end }}

# A firing critical alert suppresses the matching warning for the same alertname,
# so you don't get paged twice for the same underlying problem.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
