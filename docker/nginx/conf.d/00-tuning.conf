# http-level tuning. Loaded first (00- prefix); nginx includes conf.d/*.conf in
# alphabetical order from INSIDE the http block, which is why an http-level
# directive is valid here and would be rejected inside a server block.

# The hash of server_name values is sized from the longest name. The Alpine
# default bucket is 32 bytes, which fit zbrr.uz and www.zbrr.uz but not
# staging.zbrr.uz — nginx then refuses to load the whole configuration with
# "could not build server_names_hash". 64 leaves room for further subdomains.
server_names_hash_bucket_size 64;
