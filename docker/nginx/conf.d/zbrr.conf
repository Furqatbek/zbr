# Reverse proxy for zbrr.uz — the mobile apps call https://zbrr.uz/api/v1/...
#
# The apps require https:// and wss:// — iOS ATS and Android's cleartext policy
# block plain http/ws in release builds. This terminates TLS and forwards to the
# single app instance over the compose network.

upstream zbr_app {
    # Single upstream on purpose: the app tier is stateful and must not be
    # load-balanced (see docs/DEPLOYMENT_CONSTRAINTS.md).
    #
    # !! RELOADING NGINX IS PART OF EVERY DEPLOY. Use scripts/deploy.sh. !!
    #
    # nginx resolves a hostname in an upstream block ONCE, at startup, and
    # caches the address for the life of the process — no TTL, no re-resolution.
    # Recreating the app container usually changes its address on the compose
    # network, and nginx goes on connecting to the old one: every request 502s
    # while the application logs a clean startup and shows no incoming traffic.
    # `nginx -s reload` re-resolves it.
    #
    # staging.conf does NOT have this problem — it uses a runtime `resolver`
    # with a variable in proxy_pass, so it follows the container by itself. The
    # difference is deliberate: an upstream block gives production a keepalive
    # pool (below), which a variable proxy_pass cannot have. The reload is what
    # that costs.
    #
    # The CONTAINER name, not the service name "app". nginx is attached to both
    # food-delivery-network and the shared zbr-edge network, and Docker's DNS
    # answers from all of them — so "app" was ambiguous the moment a second
    # compose project defined a service by that name, and production requests
    # were served by the staging container against the staging database.
    server food-delivery-app:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP :80 — ACME challenges + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name zbrr.uz www.zbrr.uz;

    # Let's Encrypt webroot challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 308, not 301: a 301 permits the client to replay the request as a bodyless
    # GET, so a POST /api/v1/orders that arrives here would reach the apex with
    # its payload dropped. 308 preserves method and body.
    location / {
        return 308 https://zbrr.uz$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS www -> apex, so there is one canonical origin.
#
# The apps are all pointed at the apex; this block exists so a stray www build
# degrades to a redirect instead of a certificate error. 308 (not 301) keeps the
# method and body intact — a mis-pointed app still places orders correctly.
# WebSockets are the exception: a redirect cannot carry an Upgrade handshake, so
# wss://www.zbrr.uz/ws will NOT work. The apps must use the apex.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zbrr.uz;

    ssl_certificate     /etc/letsencrypt/live/zbrr.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zbrr.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 308 https://zbrr.uz$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS :443 — the API
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zbrr.uz;

    ssl_certificate     /etc/letsencrypt/live/zbrr.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zbrr.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: only enable once you are certain HTTPS works — browsers cache it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Image/menu uploads are capped at 10MB by the app; leave headroom for the
    # multipart envelope or large uploads fail here with 413 before reaching it.
    client_max_body_size 12m;

    access_log /var/log/nginx/zbrr.access.log;
    error_log  /var/log/nginx/zbrr.error.log;

    # -----------------------------------------------------------------------
    # WebSocket / STOMP — order updates, courier offers, kitchen tickets.
    # These need the Upgrade handshake and must NOT be closed by the default
    # 60s proxy_read_timeout: a socket idles between orders and would be
    # dropped, which the backend treats as a courier going OFFLINE.
    # -----------------------------------------------------------------------
    location ~ ^/(ws|ws-native|ws-sockjs) {
        proxy_pass http://zbr_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
    }

    # Actuator is admin-only in the app; keep it off the public internet too.
    location /actuator/ {
        deny all;
    }

    # -----------------------------------------------------------------------
    # The API itself. Everything the apps call lives under /api/v1/.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://zbr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # REQUIRED: the app derives the client IP from X-Forwarded-For for
        # per-IP rate limiting and refresh-token records. Without it every
        # request looks like it came from nginx and all users share one bucket.
        #
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter APPENDS to
        # whatever the client sent, and the app reads the leftmost entry — so a
        # caller supplying its own X-Forwarded-For picks its own rate-limit
        # bucket and can rotate it per request, making every per-IP limit
        # (login brute force, OTP flooding) meaningless. Overwriting here is
        # what makes the header trustworthy; this is a security control, not a
        # style choice. Only revisit it if a CDN is put in front of nginx, and
        # then teach the app how many hops to trust FIRST.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # To serve a marketing site at https://zbrr.uz/ later, add a static root
    # here and narrow the block above to `location /api/` (keeping the /ws
    # block as-is). The apps only use /api/v1/ and /ws.
}
