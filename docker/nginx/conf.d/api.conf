# API reverse proxy for api.zbrr.uz
#
# The mobile apps require https:// and wss:// — iOS ATS and Android's cleartext
# policy block plain http/ws in release builds. This terminates TLS and forwards
# to the single app instance over the compose network.
#
# To use a different hostname, replace api.zbrr.uz everywhere in this file and
# reissue the certificate.

upstream zbr_app {
    # Single upstream on purpose: the app tier is stateful and must not be
    # load-balanced (see docs/DEPLOYMENT_CONSTRAINTS.md).
    server app:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP :80 — ACME challenges + redirect everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.zbrr.uz;

    # Let's Encrypt webroot challenge must stay on plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443 — the API
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.zbrr.uz;

    ssl_certificate     /etc/letsencrypt/live/api.zbrr.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zbrr.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: only enable once you are certain HTTPS works — browsers cache it.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Image/menu uploads are capped at 10MB by the app; leave headroom for the
    # multipart envelope or large uploads fail at nginx with 413 before reaching it.
    client_max_body_size 12m;

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    # -----------------------------------------------------------------------
    # WebSocket / STOMP — order updates, courier offers, kitchen tickets.
    # These need the Upgrade handshake and must NOT be closed by the default
    # 60s proxy_read_timeout: a socket idles between orders and would be
    # dropped, which the backend treats as a courier going OFFLINE.
    # -----------------------------------------------------------------------
    location ~ ^/(ws|ws-native|ws-sockjs) {
        proxy_pass http://zbr_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
    }

    # -----------------------------------------------------------------------
    # Everything else — REST API
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://zbr_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # REQUIRED: the app derives the client IP from X-Forwarded-For for
        # per-IP rate limiting and refresh-token records. Without it every
        # request looks like it came from nginx and all users share one bucket.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Actuator is admin-only in the app, but keep it off the public internet too.
    location /actuator/ {
        deny all;
    }
}
