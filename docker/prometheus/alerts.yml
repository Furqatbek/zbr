# Prometheus Alerting Rules for Food Delivery Platform

groups:
  # Application Alerts
  - name: application
    rules:
      - alert: ApplicationDown
        expr: up{job="food-delivery-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Food Delivery Application is down"
          description: "The Food Delivery application has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "More than 5% of requests are resulting in 5xx errors."

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds."

      - alert: HighHeapUsage
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage is high"
          description: "JVM heap usage is above 85%."

      - alert: DatabaseConnectionPoolNearLimit
        expr: hikaricp_connections_active > 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool near limit"
          description: "HikariCP has >15 of 20 active connections for 5m — approaching pool exhaustion."

      # Threads are BLOCKED waiting for a DB connection: the pool is exhausted and
      # requests are stalling. This is the real "DB pool exhausted" pager signal.
      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool exhausted"
          description: "{{ $value }} thread(s) waiting for a DB connection for 2m — HikariCP pool is exhausted; requests are stalling."

      # The application is logging ERRORs (unhandled exceptions, failed side effects).
      # Complements HighErrorRate, which only sees errors that reach an HTTP 5xx.
      - alert: ApplicationErrorLogs
        expr: increase(logback_events_total{level="error"}[5m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Application is logging errors"
          description: "More than 5 ERROR log events in the last 5 minutes ({{ $value | printf \"%.0f\" }})."

  # PostgreSQL Alerts
  - name: postgresql
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database has been down for more than 1 minute."

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL has too many connections"
          description: "PostgreSQL has more than 80 active connections."

      - alert: PostgreSQLLowCacheHitRatio
        expr: (pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read)) < 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL cache hit ratio is low"
          description: "PostgreSQL buffer cache hit ratio is below 90%."

      - alert: PostgreSQLDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "PostgreSQL has detected deadlocks in the last 5 minutes."

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_database_xact_commit[5m]) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL transaction rate is very low"
          description: "PostgreSQL transaction commit rate is below 1 per second."

  # Redis Alerts
  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis cache has been down for more than 1 minute."

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is above 85%."

      - alert: RedisLowHitRate
        expr: (redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total)) < 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache hit rate is low"
          description: "Redis cache hit rate is below 80%."

      - alert: RedisTooManyConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis has too many connections"
          description: "Redis has more than 100 connected clients."

      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis is rejecting connections"
          description: "Redis has rejected connections in the last 5 minutes."

  # RabbitMQ Alerts
  - name: rabbitmq
    rules:
      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages_ready > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ messages are piling up"
          description: "More than 1000 messages ready across queues for 10m — consumers are down or too slow."

      # A sustained redelivery rate means consumers keep rejecting/requeueing the
      # same messages (e.g. the SMS infinite-requeue incident) — work loops forever.
      - alert: RabbitMQRedeliveryStorm
        expr: rate(rabbitmq_global_messages_redelivered_total[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ redelivery storm"
          description: "Messages are being redelivered at {{ $value | printf \"%.1f\" }}/s for 10m — a consumer is likely stuck rejecting/requeueing the same messages."

  # Infrastructure Alerts
  - name: infrastructure
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "{{ $labels.job }} target {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus config reload failed"
          description: "Prometheus failed to reload its configuration."
