# Prometheus Configuration for Food Delivery Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'food-delivery-monitor'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # Spring Boot Application Metrics
  - job_name: 'food-delivery-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'food-delivery-platform'
          environment: 'docker'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'food-delivery-backend'

  # PostgreSQL Database Metrics
  - job_name: 'postgresql'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          database: 'fooddelivery'
          environment: 'docker'

  # Redis Cache Metrics
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          cache: 'redis'
          environment: 'docker'
