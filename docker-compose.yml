services:
  # Food Delivery Backend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-delivery-app
    mem_limit: 1500m
    ports:
      # Loopback only: nginx reaches the app over the compose network. Publishing
      # 8080 publicly would bypass TLS entirely.
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fooddelivery
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:?set RABBITMQ_USER}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      # Must be supplied from the host environment; compose errors if unset. Generate with: openssl rand -base64 48
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (e.g. export JWT_SECRET=$(openssl rand -base64 48))}
      - JWT_EXPIRATION=3600000
      - JWT_REFRESH_EXPIRATION=604800000
      - IMAGE_STORAGE_PATH=/app/images
      # MUST be the public URL in production or every image URL returned to the
      # mobile apps points at localhost and no photo loads.
      - IMAGE_BASE_URL=${IMAGE_BASE_URL:-http://localhost:8080/api/v1/images}
      # CORS: defaults to "*" (no enforcement) for local launch. In prod set
      # CORS_ORIGINS in .env to explicit domains, e.g. https://app.example.com
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Push — Android (FCM via Firebase) and iOS (APNs HTTP/2 + .p8).
      # See docs/PUSH_DELIVERY.md. Supply the APNs key EITHER as base64 in .env
      # (APNS_KEY_BASE64 — nothing on disk) OR as a file mounted at ./secrets.
      - FIREBASE_ENABLED=${FIREBASE_ENABLED:-false}
      - FIREBASE_CREDENTIALS_BASE64=${FIREBASE_CREDENTIALS_BASE64:-}
      - FIREBASE_CREDENTIALS_FILE=${FIREBASE_CREDENTIALS_FILE:-firebase-service-account.json}
      - APNS_ENABLED=${APNS_ENABLED:-false}
      - APNS_KEY_BASE64=${APNS_KEY_BASE64:-}
      - APNS_KEY_FILE=${APNS_KEY_FILE:-}
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_TOPIC=${APNS_TOPIC:-com.zbr.owner}
      - APNS_PRODUCTION=${APNS_PRODUCTION:-false}
      # App-store review test number (see docs/GO_LIVE.md). Clear after review.
      - OTP_REVIEW_NUMBERS=${OTP_REVIEW_NUMBERS:-}
      - OTP_REVIEW_CODE=${OTP_REVIEW_CODE:-}
      # SMS (OTP login only). NOTE: the app reads the SMS_ESKIZ_* names — the old
      # short SMS_EMAIL/SMS_PASSWORD/SMS_FROM were never read and are accepted
      # here only as a fallback so existing .env files keep working.
      - SMS_ENABLED=${SMS_ENABLED:-true}
      - SMS_PROVIDER=${SMS_PROVIDER:-ESKIZ}
      - SMS_ESKIZ_EMAIL=${SMS_ESKIZ_EMAIL:-${SMS_EMAIL:-}}
      - SMS_ESKIZ_PASSWORD=${SMS_ESKIZ_PASSWORD:-${SMS_PASSWORD:-}}
      - SMS_ESKIZ_FROM=${SMS_ESKIZ_FROM:-${SMS_FROM:-4546}}
      - SMS_ESKIZ_CALLBACK_URL=${SMS_ESKIZ_CALLBACK_URL:-${SMS_CALLBACK_URL:-}}
    volumes:
      - images-data:/app/images
      - ./data/images:/app/images
      # Push credentials (.p8 / firebase JSON) if you supply them as files.
      # Gitignored; the dir may be empty when using APNS_KEY_BASE64 instead.
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - food-delivery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # TLS reverse proxy — the only service exposed to the internet.
  # Mobile release builds reject plain http/ws, so https/wss is mandatory.
  nginx:
    image: nginx:1.25-alpine
    container_name: food-delivery-nginx
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - food-delivery-network
    restart: unless-stopped
    # A renewed certificate is a NEW file behind the same path; nginx keeps
    # serving the one it loaded at startup until told otherwise. Reloading every
    # 6h picks it up on its own — certbot renews 30 days before expiry, so there
    # is a wide window and no need to signal across containers.
    command: >-
      sh -c "while :; do sleep 6h; nginx -s reload; done & nginx -g 'daemon off;'"

  # Certificate renewal (Let's Encrypt, webroot challenge through nginx).
  # Issue the FIRST certificate with scripts/tls/init-letsencrypt.sh — nginx
  # cannot start without one, so it is issued with certbot's own web server
  # while nginx is down. From then on this loop renews it twice a day.
  #
  # The two volumes are the whole contract with nginx:
  #   certbot-www  — certbot writes the ACME challenge here, nginx serves it
  #                  from /.well-known/acme-challenge/ (see zbrr.conf)
  #   certbot-conf — certbot writes the certificate here, nginx reads it
  # nginx mounts both read-only: it never writes a certificate, only serves one.
  certbot:
    image: certbot/certbot:latest
    container_name: food-delivery-certbot
    mem_limit: 64m
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    networks:
      - food-delivery-network
    # --webroot is passed explicitly so renewal uses nginx even though the first
    # certificate was issued with --standalone. Verify with:
    #   docker compose exec certbot certbot renew --webroot -w /var/www/certbot --dry-run
    entrypoint: >-
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: food-delivery-postgres
    mem_limit: 768m
    ports:
      # Loopback only: never expose the database to the internet.
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=fooddelivery
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - food-delivery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fooddelivery"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Automated PostgreSQL backups (scheduled pg_dump + retention)
  # Uses the same postgres:15-alpine image so the pg_dump client version matches
  # the server. Runs pg_backup.sh on a loop; healthcheck fails if no successful
  # backup landed within the interval + a 2h grace window.
  postgres-backup:
    image: postgres:15-alpine
    container_name: food-delivery-postgres-backup
    mem_limit: 128m
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - PGDATABASE=fooddelivery
      - BACKUP_DIR=/backups
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup:/scripts:ro
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] service starting; interval=$${BACKUP_INTERVAL_SECONDS}s keep=$${BACKUP_KEEP_DAYS}d"
        while true; do
          /scripts/pg_backup.sh || echo "[backup] cycle failed"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - food-delivery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name last_success -mmin -$$(( $${BACKUP_INTERVAL_SECONDS:-86400}/60 + 120 )) | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    mem_limit: 384m
    ports:
      # Loopback only: Redis has no auth configured.
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - food-delivery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: food-delivery-rabbitmq
    mem_limit: 512m
    ports:
      # Loopback only: AMQP + the management UI must not be public.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?set RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Enables the rabbitmq_prometheus plugin (metrics on :15692, scraped over
      # the compose network — no host port published).
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks:
      - food-delivery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Exporter for Database Metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: food-delivery-postgres-exporter
    mem_limit: 64m
    ports:
      # Loopback-only: exposes DB internals, no auth. Prometheus scrapes it over
      # the compose network, so no public host port is needed.
      - "127.0.0.1:9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/fooddelivery?sslmode=disable
    networks:
      - food-delivery-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Exporter for Cache Metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: food-delivery-redis-exporter
    mem_limit: 64m
    ports:
      # Loopback-only: scraped over the compose network, no public port needed.
      - "127.0.0.1:9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - food-delivery-network
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: food-delivery-prometheus
    mem_limit: 512m
    ports:
      # Loopback-only: no auth in front of Prometheus. Reach it via SSH tunnel or
      # an authenticated reverse proxy; never expose it publicly.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - food-delivery-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager: routes Prometheus alerts to a Telegram bot. The bot token is
  # read from a mounted, gitignored secret file — see docs/ALERTING.md.
  # Alertmanager failing to start does NOT affect the app.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: food-delivery-alertmanager
    mem_limit: 128m
    ports:
      # Loopback-only: Alertmanager has no auth and its UI can silence alerts.
      - "127.0.0.1:9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./docker/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - food-delivery-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:10.1.5
    container_name: food-delivery-grafana
    mem_limit: 256m
    ports:
      # Loopback only: reach Grafana over an SSH tunnel (see docs/ALERTING.md).
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/business-overview.json
      # Used by datasource provisioning ($__env{DB_PASSWORD}) for the PostgreSQL
      # datasource that powers the business-overview SQL panels.
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - food-delivery-network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  food-delivery-network:
    driver: bridge

volumes:
  certbot-www:
  certbot-conf:
  postgres-data:
  postgres-backups:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  images-data:
    driver: local
